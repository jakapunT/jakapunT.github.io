<!doctype html>
<html lang="th" class="staticrypt-html">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta http-equiv="cache-control" content="max-age=0">
<meta http-equiv="cache-control" content="no-cache">
<meta http-equiv="expires" content="0">
<meta http-equiv="pragma" content="no-cache">
<title>/*[|template_title|]*/0</title>
<!-- Password screen for course pages. StatiCrypt fills the /*[|...|]*/ placeholders; publish.mjs
     fills the {{...}} ones. Nothing here may name a lecture: this part of the file is public. -->
<style>
{{FONT_CSS}}
{{TOKENS_CSS}}
*, *::before, *::after { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
  background: var(--ground); color: var(--ink);
  font: var(--text-body)/1.7 'Course Text', var(--font-thai);
}
[lang='en'] { font-family: 'Course Head', var(--font-latin); }
.hidden { display: none !important; }
.card {
  width: 100%; max-width: 460px; padding: 36px 36px 32px;
  background: var(--card); border: 1px solid var(--card-border);
  border-radius: var(--radius-card); box-shadow: var(--card-shadow);
}
.course { margin: 0; font: var(--weight-heading) 26px/1.25 'Course Head', var(--font-latin); letter-spacing: -.01em; }
.course-th { margin: 4px 0 0; font-size: var(--text-small); color: var(--muted); }
.rule { height: 1px; margin: 22px 0; background: var(--rule); border: 0; }
.instructions { margin: 0 0 16px; color: var(--ink-2); font-size: 18px; }
label.field { display: block; margin-bottom: 6px; font-weight: 500; font-size: var(--text-small); }
.pw { display: flex; gap: 8px; }
.pw input {
  flex: 1; min-width: 0; min-height: var(--tap); padding: 0 14px;
  border: 1px solid var(--muted); border-radius: 12px; background: var(--card); color: var(--ink);
  font: 18px 'Course Text', var(--font-thai);
}
.toggle {
  min-height: var(--tap); min-width: 64px; padding: 0 12px;
  border: 1px solid var(--card-border); border-radius: 12px; background: var(--cream); color: var(--ink);
  font: 500 var(--text-small) 'Course Text', var(--font-thai); cursor: pointer;
}
.remember { display: flex; align-items: center; gap: 10px; min-height: var(--tap); margin-top: 10px; font-size: var(--text-small); color: var(--ink-2); cursor: pointer; }
.remember input { width: 20px; height: 20px; accent-color: var(--ink); }
.error { margin: 10px 0 0; color: var(--bad); font-size: var(--text-small); font-weight: 500; }
.submit {
  width: 100%; min-height: 48px; margin-top: 16px; border: 0; border-radius: var(--radius-pill);
  background: var(--ink); color: var(--card); font: 600 18px 'Course Text', var(--font-thai); cursor: pointer;
}
.submit:hover { background: var(--ink-2); }
.help { margin: 18px 0 0; font-size: var(--text-small); color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 3px; }
.spinner { width: 40px; height: 40px; border: 4px solid var(--card-border); border-right-color: var(--accent); border-radius: 50%; animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
@media (max-width: 480px) { .card { padding: 28px 22px 24px; } }
</style>
</head>
<body class="staticrypt-body">
<div id="staticrypt_loading" role="status" aria-label="กำลังเปิด / Loading"><div class="spinner"></div></div>
<main id="staticrypt_content" class="card hidden">
  <p class="course" lang="en">{{COURSE_TITLE}}</p>
  <p class="course-th">{{COURSE_TITLE_TH}}</p>
  <hr class="rule">
  <p class="instructions">/*[|template_instructions|]*/0</p>
  <form id="staticrypt-form" action="#" method="post">
    <label class="field" for="staticrypt-password">รหัสผ่าน <span lang="en">(Password)</span></label>
    <div class="pw">
      <input id="staticrypt-password" type="password" name="password" autocomplete="current-password" aria-describedby="staticrypt-error" autofocus>
      <button type="button" class="toggle" id="staticrypt-toggle" aria-pressed="false">แสดง</button>
    </div>
    <label id="staticrypt-remember-label" class="remember hidden">
      <input id="staticrypt-remember" type="checkbox" name="remember" checked>
      /*[|template_remember|]*/0
    </label>
    <p id="staticrypt-error" class="error" role="alert"></p>
    <button type="submit" class="submit">/*[|template_button|]*/0</button>
  </form>
  <p class="help">ถ้าไม่มีรหัสผ่าน ให้ติดต่ออาจารย์ผู้สอน <span lang="en">Ask your teacher for the password.</span></p>
</main>
<script>
  const staticryptInitiator = /*[|js_staticrypt|]*/ 0;
  const templateError = "/*[|template_error|]*/0",
    isRememberEnabled = /*[|is_remember_enabled|]*/ 0,
    staticryptConfig = /*[|staticrypt_config|]*/ 0;

  // one remembered password per course, shared by every page of that course
  const templateConfig = {
    rememberExpirationKey: "staticrypt_expiration_{{SLUG}}",
    rememberPassphraseKey: "staticrypt_passphrase_{{SLUG}}",
    replaceHtmlCallback: null,
    clearLocalStorageCallback: null,
  };
  const staticrypt = staticryptInitiator.init(staticryptConfig, templateConfig);

  window.onload = async function () {
    let ok = false;
    try { ok = (await staticrypt.handleDecryptOnLoad()).isSuccessful; } catch (e) { ok = false; }
    if (!ok) {
      document.getElementById("staticrypt_loading").classList.add("hidden");
      document.getElementById("staticrypt_content").classList.remove("hidden");
      document.getElementById("staticrypt-password").focus();
      if (isRememberEnabled) document.getElementById("staticrypt-remember-label").classList.remove("hidden");
    }
  };

  const toggle = document.getElementById("staticrypt-toggle");
  toggle.addEventListener("click", function () {
    const input = document.getElementById("staticrypt-password");
    const show = input.type === "password";
    input.type = show ? "text" : "password";
    toggle.textContent = show ? "ซ่อน" : "แสดง";
    toggle.setAttribute("aria-pressed", String(show));
  });

  document.getElementById("staticrypt-form").addEventListener("submit", async function (e) {
    e.preventDefault();
    const error = document.getElementById("staticrypt-error");
    error.textContent = "";
    const password = document.getElementById("staticrypt-password").value;
    const remember = document.getElementById("staticrypt-remember").checked;
    const { isSuccessful } = await staticrypt.handleDecryptionOfPage(password, remember);
    if (!isSuccessful) {
      error.textContent = templateError;
      document.getElementById("staticrypt-password").select();
    }
  });
</script>
</body>
</html>
